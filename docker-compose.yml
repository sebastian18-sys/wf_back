services:
  api:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile
      target: development
    container_name: app-api-dev
    env_file: .env
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
